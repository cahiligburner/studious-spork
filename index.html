<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PAYROLL</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 50px;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        h1 { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .card { 
            /* Glassmorphism Effect */
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            
            padding: 40px; 
            margin: 15px; 
            border-radius: 12px; 
            display: inline-block; 
            width: 250px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); 
            transition: 0.3s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-5px);
        }

        a { 
            text-decoration: none; 
            
            /* CHANGE THIS TO #000000 FOR BLACK OR #333333 FOR DARK GRAY */
            color: #000000; 
            
            font-weight: bold; 
            font-size: 1.2rem; 
            
            /* This adds a subtle glow behind the text so it's readable on ANY background */
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); 
        }
    </style>
</head>
<body>
    <h1>Select Payroll</h1>
    
    <div class="card">
        <a href="KINGS/kings.html">KINGS PAYROLL</a>
    </div>

    <div class="card">
        <a href="DOMZ/domz.html">DOMZ PAYROLL</a>
    </div>
</body>
</html>
