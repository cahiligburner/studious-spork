<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMZ PAYROLL PRO</title>
<link rel="icon" type="image/x-icon" href="icon.ico">
<header>
    <nav>
        <a href="index.html">
            <img src="bg.png" alt="Company Logo" width="150">
        </a>
    </nav>
</header>

<style>
 body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    text-align: left; 
    padding: 20px;
    background-image: url('../bg.jpg'); /* Ensure this path is correct on GitHub */
    background-size: cover;        
    background-position: center;   
    background-attachment: fixed;  
    background-repeat: no-repeat;
    color: #333;
}

/* Glassmorphism Effect for the main container */
.container {
    background: rgba(255, 255, 255, 0.25); /* Semi-transparent white */
    backdrop-filter: blur(12px);           /* Frosted glass blur */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    max-width: 1450px;
    margin: auto;
}

h2 {
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-top: 0;
}

.rates {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

.rate-box {
    background: rgba(255, 255, 255, 0.4);
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.config-area {
    background: rgba(255, 255, 255, 0.2);
    padding: 15px;
    border: 1px dashed rgba(255, 255, 255, 0.5);
    margin-bottom: 20px;
    border-radius: 10px;
}

.input-area {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
}

input {
    padding: 10px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.6); /* Transparent inputs */
    width: 100%;
    box-sizing: border-box;
    font-weight: bold;
}

input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.9);
    border-color: #007bff;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: rgba(255, 255, 255, 0.1); /* Transparent table body */
}

th, td {
    padding: 12px 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    text-align: center;
}

th {
    background: rgba(255, 255, 255, 0.3); /* Transparent headers */
    font-weight: bold;
    font-size: 11px;
    text-transform: uppercase;
}

.total-row {
    font-weight: bold;
    background: rgba(255, 255, 255, 0.4); /* Transparent footer */
}

.penalty { color: #d93025; font-weight: bold; }

.buttons { margin-top: 20px; }

button {
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.5);
    border-radius: 6px;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    background: rgba(255, 255, 255, 0.8);
    transform: translateY(-2px);
}

.btn-delete { color: #d93025; border: none; background: none; font-size: 18px; }

/* Print adjustments */
@media print {
    body { background: none; padding: 0; }
    .container { box-shadow: none; border: none; background: white; }
    .config-area, .buttons, .btn-delete { display: none; }
}
</style>
</head>

<body>

<div class="container">
    <h2>DOMZ PAYROLL</h2>

    <div class="config-area">
        <strong> Add Custom Rate</strong>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <input type="text" id="newRateName" placeholder="Rate Name (e.g. Bonus)" style="width: 200px;">
            <input type="number" id="newRateValue" placeholder="Rate" style="width: 200px;">
            <button onclick="addNewRateColumn()">Add Column</button>
        </div>
    </div>

    <div class="rates" id="ratesContainer">
        <div class="rate-box">DAILY: ₱908.60/hr</div>
        <div class="rate-box">REG OT: ₱117.28125/hr</div>
        <div class="rate-box">REST DAY: ₱121.9725/hr</div>
        <div class="rate-box">REST DAY OT: ₱158.56425/hr</div>
        <div class="rate-box">NIGHTY DUTY: ₱9.3825/hr</div>
        <div class="rate-box">LATE: ₱1.44792/min</div>
    </div>

    <div class="input-area" id="dynamicInputs">
        <input type="number" id="regDays" placeholder="DAYS" step="0.25" autofocus>
        <input type="number" id="regOT" placeholder="REG OT" step="0.5">
        <input type="number" id="rdOT" placeholder="REST DAY" step="0.5">
        <input type="number" id="rdExceed" placeholder="REST DAY OT" step="0.5">
        <input type="number" id="nightDuty" placeholder="NIGHT DUTY" step="0.5">
        <input type="number" id="lateMin" placeholder="LATE (min)">
    </div>

    <table id="payrollTable">
        <thead>
            <tr id="headerRow">
                <th>Action</th>
                <th>DAYS</th><th>Pay</th>
                <th>REG OT</th><th>Pay</th>
                <th>REST DAY</th><th>Pay</th>
                <th>RD OT</th><th>Pay</th>
                <th>ND</th><th>Pay</th>
                <th>LATE</th><th>Penalty</th>
                <th>TOTAL</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr class="total-row" id="footerRow">
                <td>TOTAL</td>
                <td id="sumReg">0</td><td id="sumRegPay">0</td>
                <td id="sumRegOT">0</td><td id="sumRegOTPay">0</td>
                <td id="sumRDOT">0</td><td id="sumRDOTPay">0</td>
                <td id="sumRDEx">0</td><td id="sumRDExPay">0</td>
                <td id="sumNight">0</td><td id="sumNightPay">0</td>
                <td id="sumLate">0</td><td id="sumPenalty" class="penalty">0</td>
                <td id="grandTotal">0</td>
            </tr>
        </tfoot>
    </table>

    <div class="buttons">
        <button onclick="window.print()">Print Report</button>
        <button onclick="exportToCSV()" style="background: rgba(0, 123, 255, 0.2);">Export to CSV</button>
        <button onclick="clearAll()" style="color:#d93025; border-color: rgba(217, 48, 37, 0.4);">Clear All</button>
    </div>

    <div style="margin-top:20px; text-align:right; color:#d93025; font-weight: bold;">
        REG DAYS + OT DAYS / REG DAYS = <span id="effValue">0</span>
    </div>
</div>

<script>
// Logic remains exactly as your provided code to ensure separate data storage works
const RATE_DAILY = 908.6;
const RATE_REG_OT = 117.28125;
const RATE_RD_OT = 121.9725;
const RATE_RD_EX = 158.56425;
const RATE_NIGHT = 9.3825;
const RATE_LATE = 1.44792;

let extraRatesList_v1 = JSON.parse(localStorage.getItem('extraRatesList_v1')) || [];
let payrollData_v1 = JSON.parse(localStorage.getItem('payrollData_v1')) || [];

window.onload = () => {
    extraRatesList_v1.forEach(item => renderNewColumnElements(item));
    renderTable();
};

function addNewRateColumn() {
    const name = document.getElementById('newRateName').value.toUpperCase();
    const rate = parseFloat(document.getElementById('newRateValue').value);
    if(!name || isNaN(rate)) return;
    const id = "extra_" + name.replace(/\s+/g, '_');
    const newItem = { id, name, rate };
    extraRatesList_v1.push(newItem);
    renderNewColumnElements(newItem);
    saveData();
    document.getElementById('newRateName').value = "";
    document.getElementById('newRateValue').value = "";
}

function renderNewColumnElements(item) {
    const box = document.createElement('div');
    box.className = 'rate-box';
    box.innerText = `${item.name}: ₱${item.rate}/hr`;
    document.getElementById('ratesContainer').appendChild(box);

    const input = document.createElement('input');
    input.type = 'number'; input.id = item.id; input.placeholder = item.name;
    document.getElementById('dynamicInputs').appendChild(input);

    const headerRow = document.getElementById('headerRow');
    const th1 = document.createElement('th'); th1.innerText = item.name;
    const th2 = document.createElement('th'); th2.innerText = "Pay";
    headerRow.insertBefore(th1, headerRow.cells[headerRow.cells.length - 1]);
    headerRow.insertBefore(th2, headerRow.cells[headerRow.cells.length - 1]);

    const footerRow = document.getElementById('footerRow');
    const td1 = document.createElement('td'); td1.id = "sumHrs_" + item.id; td1.innerText = "0";
    const td2 = document.createElement('td'); td2.id = "sumPay_" + item.id; td2.innerText = "0";
    footerRow.insertBefore(td1, footerRow.cells[footerRow.cells.length - 1]);
    footerRow.insertBefore(td2, footerRow.cells[footerRow.cells.length - 1]);
}

document.getElementById('dynamicInputs').addEventListener("keydown", e => {
    if(e.key === "Enter") addRow();
});

function addRow() {
    let entry = {
        id: Date.now(),
        reg: +regDays.value || 0,
        regOT: +regOT.value || 0,
        rd: +rdOT.value || 0,
        rdEx: +rdExceed.value || 0,
        night: +nightDuty.value || 0,
        late: +lateMin.value || 0,
        extras: {}
    };
    extraRatesList_v1.forEach(r => {
        entry.extras[r.id] = +document.getElementById(r.id).value || 0;
    });
    if (Object.values(entry).some(v => v > 0) || Object.values(entry.extras).some(v => v > 0)) {
        payrollData_v1.push(entry);
        saveData();
        renderTable();
        document.querySelectorAll("#dynamicInputs input").forEach(i => i.value = "");
        regDays.focus();
    }
}

function renderTable() {
    const tbody = document.querySelector("#payrollTable tbody");
    tbody.innerHTML = "";
    let t = { reg:0, regP:0, rot:0, rotP:0, rd:0, rdP:0, rdx:0, rdxP:0, ni:0, niP:0, la:0, pen:0, grand:0, extraTotals:{} };
    extraRatesList_v1.forEach(r => t.extraTotals[r.id] = { hrs:0, pay:0 });

    payrollData_v1.forEach((row, index) => {
        let rp = row.reg * RATE_DAILY;
        let rotp = row.regOT * RATE_REG_OT;
        let rdp = row.rd * RATE_RD_OT;
        let rdxp = row.rdEx * RATE_RD_EX;
        let nip = row.night * RATE_NIGHT;
        let pen = row.late * RATE_LATE;
        let rowTotal = rp + rotp + rdp + rdxp + nip - pen;

        let extraCells = "";
        extraRatesList_v1.forEach(r => {
            let hrs = row.extras[r.id] || 0;
            let pay = hrs * r.rate;
            rowTotal += pay;
            t.extraTotals[r.id].hrs += hrs;
            t.extraTotals[r.id].pay += pay;
            extraCells += `<td>${hrs}</td><td>${pay.toFixed(2)}</td>`;
        });

        const tr = tbody.insertRow();
        tr.innerHTML = `
            <td><button class="btn-delete" onclick="deleteRow(${index})">✕</button></td>
            <td>${row.reg}</td><td>${rp.toFixed(2)}</td>
            <td>${row.regOT}</td><td>${rotp.toFixed(2)}</td>
            <td>${row.rd}</td><td>${rdp.toFixed(2)}</td>
            <td>${row.rdEx}</td><td>${rdxp.toFixed(2)}</td>
            <td>${row.night}</td><td>${nip.toFixed(2)}</td>
            <td>${row.late}</td><td class="penalty">-${pen.toFixed(2)}</td>
            ${extraCells}
            <td>${rowTotal.toFixed(2)}</td>
        `;
        t.reg += row.reg; t.regP += rp; t.rot += row.regOT; t.rotP += rotp;
        t.rd += row.rd; t.rdP += rdp; t.rdx += row.rdEx; t.rdxP += rdxp;
        t.ni += row.night; t.niP += nip; t.la += row.late; t.pen += pen; t.grand += rowTotal;
    });

    sumReg.innerText = t.reg.toFixed(2); sumRegPay.innerText = t.regP.toFixed(2);
    sumRegOT.innerText = t.rot.toFixed(2); sumRegOTPay.innerText = t.rotP.toFixed(2);
    sumRDOT.innerText = t.rd.toFixed(2); sumRDOTPay.innerText = t.rdP.toFixed(2);
    sumRDEx.innerText = t.rdx.toFixed(2); sumRDExPay.innerText = t.rdxP.toFixed(2);
    sumNight.innerText = t.ni.toFixed(2); sumNightPay.innerText = t.niP.toFixed(2);
    sumLate.innerText = t.la.toFixed(2); sumPenalty.innerText = t.pen.toFixed(2);
    grandTotal.innerText = t.grand.toFixed(2);

    extraRatesList_v1.forEach(r => {
        document.getElementById("sumHrs_" + r.id).innerText = t.extraTotals[r.id].hrs.toFixed(2);
        document.getElementById("sumPay_" + r.id).innerText = t.extraTotals[r.id].pay.toFixed(2);
    });

    let extraHrs = Object.values(t.extraTotals).reduce((a, b) => a + b.hrs, 0);
    let effNum = t.reg + ((t.rot + t.rd + t.rdx + extraHrs) / 8);
    effValue.innerText = `${effNum.toFixed(2)} / ${t.reg || 0}`;
}

function deleteRow(index) {
    if(confirm("Remove this entry?")) {
        payrollData_v1.splice(index, 1);
        saveData();
        renderTable();
    }
}

function saveData() {
    localStorage.setItem('payrollData_v1', JSON.stringify(payrollData_v1));
    localStorage.setItem('extraRatesList_v1', JSON.stringify(extraRatesList_v1));
}

function clearAll() {
    if(confirm("Are you sure you want to delete EVERYTHING?")) {
        payrollData_v1 = [];
        extraRatesList_v1 = [];
        saveData();
        location.reload();
    }
}

function exportToCSV() {
    let rows = [];
    const table = document.getElementById("payrollTable");
    for (let i = 0; i < table.rows.length; i++) {
        let cols = Array.from(table.rows[i].cells).map(c => c.innerText.replace("✕", ""));
        rows.push(cols.join(","));
    }
    const csvContent = "data:text/csv;charset=utf-8," + rows.join("\n");
    const link = document.createElement("a");
    link.setAttribute("href", encodeURI(csvContent));
    link.setAttribute("download", "payroll_report.csv");
    document.body.appendChild(link);
    link.click();
}
</script>
</body>
</html>
